# nginx for travaux-api, in the same two parts as unhrdb-api's nginx-snippet.conf.
#
#  PART 1 -> a new file, /etc/nginx/conf.d/travaux-cache.conf (proxy_cache_path and limit_req_zone are http{} level)
#  PART 2 -> inside the server { listen 443 ssl; ... } block of sites-enabled/default, next to `location /unhrdb-api/`
#            (the API at /travaux-api/ and the site, static, at /travaux/)
#
# Then:  sudo nginx -t && sudo systemctl reload nginx
#
# The disk was at 90% when this was written (4.9 GB free): the cache is capped at 100 MB.

# ---------------------------------------------------------------------------
# PART 1 -- /etc/nginx/conf.d/travaux-cache.conf
# ---------------------------------------------------------------------------
upstream travaux_api {
  server 127.0.0.1:8006;  # the TRAVAUX_PORT of .env on the VM
}

proxy_cache_path /var/cache/nginx/travaux levels=1:2 keys_zone=travaux:10m max_size=100m inactive=24h use_temp_path=off;
limit_req_zone $binary_remote_addr zone=travaux_rl:10m rate=10r/s;

# ---------------------------------------------------------------------------
# PART 2 -- in the server block
# ---------------------------------------------------------------------------
location /travaux-api/ {
  rewrite ^/travaux-api/(.*)$ /$1 break;
  proxy_pass http://travaux_api;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

  # 10 requests a second per address, bursts of 30
  limit_req zone=travaux_rl burst=30 nodelay;

  # the API sets its own CORS headers (Origin is passed through) and Cache-Control; nginx caches what it marks public
  proxy_cache travaux;
  proxy_cache_valid 200 5m;
  proxy_cache_key "$scheme$request_uri$http_origin";  # the CORS header depends on the Origin
  proxy_cache_use_stale error timeout updating;
  add_header X-Cache-Status $upstream_cache_status;

  gzip on;
  gzip_types application/json text/csv;
  gzip_min_length 1024;

  proxy_read_timeout 30s;
}

# The site (the bundle's site/ folder: static files and the config.js that deploy/build_bundle.py writes), served by the same
# container, which mounts it read-only (nginx's user cannot read a home folder on Ubuntu). The API is on the same host, so the site
# calls it by the relative path /travaux-api and needs no CORS setting.
location = /travaux { return 301 /travaux/; }
location /travaux/ {
  proxy_pass http://travaux_api/;
  proxy_set_header Host $host;
  limit_req zone=travaux_rl burst=30 nodelay;
  proxy_hide_header Cache-Control;
  add_header Cache-Control "public, max-age=300";
  gzip on;
  gzip_types text/css application/javascript image/svg+xml;
}

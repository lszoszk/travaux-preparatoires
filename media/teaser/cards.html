<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../site/assets/fonts.css">
<link rel="stylesheet" href="../../site/assets/tokens.css">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; background: var(--paper); color: var(--ink-2); }
  .card { box-sizing: border-box; width: 1920px; height: 1080px; padding: 0 220px; display: flex; flex-direction: column; justify-content: center; }
  .folio { font-family: 'JetBrains Mono', monospace; letter-spacing: .18em; font-size: 22px; text-transform: uppercase; color: var(--garnet); }
  h1 { font-family: 'Spectral', serif; font-weight: 400; font-size: 118px; line-height: 1.05; margin: 22px 0 28px; }
  .rule { width: 160px; border-top: 3px solid var(--garnet); margin: 6px 0 34px; }
  .lede { font-family: 'Source Serif 4', serif; font-style: italic; font-size: 40px; line-height: 1.35; color: var(--ink-2); max-width: 1300px; }
  .status { font-family: 'Spectral', serif; font-size: 52px; margin: 6px 0 30px; color: var(--garnet); }
  .figs { font-family: 'JetBrains Mono', monospace; font-size: 26px; letter-spacing: .06em; color: #4a4e57; line-height: 1.8; }
  .who { font-family: 'Source Serif 4', serif; font-size: 30px; margin-top: 46px; color: #4a4e57; }
</style></head>
<body>
<div class="card" id="card"></div>
<script>
  const q = new URLSearchParams(location.search);
  const f = JSON.parse(q.get("figs") || "{}");
  const n = (x) => Number(x || 0).toLocaleString("en-GB");
  document.getElementById("card").innerHTML = q.get("card") === "end" ? `
    <div class="folio">UDHR · ICCPR · ICESCR · 1946–1966</div>
    <h1>UN Travaux Préparatoires</h1>
    <div class="rule"></div>
    <div class="status">Working edition — coming soon</div>
    <div class="figs">${n(f.records)} UN records and documents · ${n(f.speeches)} speeches · ${n(f.votes)} votes</div>
    <div class="who">${q.get("who") || ""}</div>` : `
    <div class="folio">Travaux préparatoires</div>
    <h1>UN Travaux Préparatoires</h1>
    <div class="rule"></div>
    <div class="lede">How the Universal Declaration and the two Covenants were drafted, speech by speech, 1946–1966</div>`;
</script>
</body></html>
